
encoding_model: cl100k_base
skip_workflows: []

llm:
  api_key: ${GRAPHRAG_API_KEY}
  type: openai_chat
  model: qwen2.5:14b
  model_supports_json: true
  api_base: http://localhost:11434/v1
  max_tokens: 4000
  request_timeout: 180.0
  # Ollama usually handles concurrency well, but let's be safe
  tokens_per_minute: 0 # unlimited
  requests_per_minute: 0 # unlimited
  max_retries: 5
  concurrent_requests: 1 # Safe for local GPU/CPU. If powerful, increase.

parallelization:
  stagger: 0.5
  num_threads: 50 # Threads for IO, but LLM is strictly sequential on local GPU usually

async_mode: threaded

embeddings:
  async_mode: threaded
  vector_store:
    type: lancedb
    db_uri: 'output/lancedb'
    container_name: default
    overwrite: true
  llm:
    api_key: ${GRAPHRAG_API_KEY}
    type: openai_embedding
    model: nomic-embed-text
    api_base: http://localhost:11434/v1
    tokens_per_minute: 0
    requests_per_minute: 0
    concurrent_requests: 5 # Embeddings are faster

chunks:
  size: 1200
  overlap: 100
  group_by_columns: [id]

input:
  type: file
  file_type: text
  base_dir: "input"
  file_encoding: utf-8
  file_pattern: ".*\\.txt$"

cache:
  type: file
  base_dir: "cache"

storage:
  type: file
  base_dir: "output"

reporting:
  type: file
  base_dir: "logs"

snapshots:
  graphml: false
  raw_entities: false
  top_level_nodes: false
